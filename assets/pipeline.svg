<circle class="moving" r="3.6" fill="#8a693f" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="12s" begin="4s" repeatCount="indefinite"/><animateMotion dur="12s" begin="4s" repeatCount="indefinite" path="M 18 658 H 39"/></circle>
