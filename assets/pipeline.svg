<circle class="moving" r="3.6" fill="#8a693f" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="9s" begin="6s" repeatCount="indefinite"/><animateMotion dur="9s" begin="6s" repeatCount="indefinite" path="M 326 658 H 355"/></circle>
<path d="M 642 658 H 671" fill="none" stroke="#8a693f" stroke-width="1.8" opacity=".7" marker-end="url(#blue-arrow)"/>
<circle class="moving" r="3.6" fill="#8a693f" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="9s" begin="8s" repeatCount="indefinite"/><animateMotion dur="9s" begin="8s" repeatCount="indefinite" path="M 642 658 H 671"/></circle>
<text x="44" y="751" font-size="13" fill="#4e5960" font-weight="400">Each experiment suite fits its own models and decision thresholds</text>
